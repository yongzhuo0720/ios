name: 编译并预览 iOS 应用

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 编译 iOS 模拟器应用
        run: |
          xcodebuild \
            -project HelloWorldApp.xcodeproj \
            -scheme HelloWorldApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 运行应用并截取预览图
        run: |
          set -euo pipefail
          device_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {print $2; exit}')"
          test -n "$device_udid"
          xcrun simctl boot "$device_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$device_udid" -b
          xcrun simctl install "$device_udid" build/Build/Products/Debug-iphonesimulator/HelloWorldApp.app
          xcrun simctl launch "$device_udid" com.example.HelloWorldApp
          sleep 5
          xcrun simctl io "$device_udid" screenshot preview.png
          xcrun simctl shutdown "$device_udid" || true

      - name: 上传预览截图
        uses: actions/upload-artifact@v5
        with:
          name: ios-preview
          path: preview.png
